<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grocery Price Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .price-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
        }
        .cheapest {
            background-color: #d4edda;
            border-color: #c3e6cb;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        .auth-container {
            max-width: 400px;
            margin: 2rem auto;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .error-message {
            display: none;
            margin-top: 1rem;
        }
        .favorite-btn {
            cursor: pointer;
            color: #dc3545;
        }
        .favorite-btn.active {
            color: #28a745;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">Grocery Price Finder</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item" id="authButtons">
                        <button class="btn btn-outline-light me-2" onclick="showLoginForm()">Login</button>
                        <button class="btn btn-light" onclick="showRegisterForm()">Register</button>
                    </li>
                    <li class="nav-item d-none" id="userMenu">
                        <div class="dropdown">
                            <button class="btn btn-outline-light dropdown-toggle" type="button" id="userDropdown" data-bs-toggle="dropdown">
                                <span id="username">User</span>
                            </button>
                            <ul class="dropdown-menu dropdown-menu-end">
                                <li><a class="dropdown-item" href="#" onclick="showFavorites()">My Favorites</a></li>
                                <li><hr class="dropdown-divider"></li>
                                <li><a class="dropdown-item" href="#" onclick="logout()">Logout</a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Filters</h5>
                        <div class="mb-3">
                            <label for="storeFilter" class="form-label">Store</label>
                            <select class="form-select" id="storeFilter">
                                <option value="">All Stores</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="sortOrder" class="form-label">Sort by Price</label>
                            <select class="form-select" id="sortOrder">
                                <option value="">No Sort</option>
                                <option value="low_to_high">Low to High</option>
                                <option value="high_to_low">High to Low</option>
                            </select>
                        </div>
                        <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                        <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div id="itemsList"></div>
                <div id="loading" class="loading" style="display: none;">
                    Loading...
                </div>
            </div>
        </div>
    </div>

    <script>
        let allItems = [];
        let currentStore = '';
        let currentSort = '';
        let currentPage = 1;
        let totalPages = 1;
        let authToken = localStorage.getItem('authToken');
        let refreshToken = localStorage.getItem('refreshToken');

        // Auth Functions
        function showLoginForm() {
            document.getElementById('loginForm').classList.remove('d-none');
            document.getElementById('registerForm').classList.add('d-none');
            document.getElementById('mainContent').classList.add('d-none');
        }

        function showRegisterForm() {
            document.getElementById('registerForm').classList.remove('d-none');
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('mainContent').classList.add('d-none');
        }

        function showMainContent() {
            document.getElementById('loginForm').classList.add('d-none');
            document.getElementById('registerForm').classList.add('d-none');
            document.getElementById('mainContent').classList.remove('d-none');
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;

            try {
                const response = await fetch('/api/auth/login/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, password }),
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('authToken', data.access);
                    localStorage.setItem('refreshToken', data.refresh);
                    authToken = data.access;
                    refreshToken = data.refresh;
                    updateAuthUI(true);
                    showMainContent();
                    loadItems();
                } else {
                    document.getElementById('loginError').textContent = data.detail || 'Login failed';
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (error) {
                console.error('Login error:', error);
                document.getElementById('loginError').textContent = 'An error occurred during login';
                document.getElementById('loginError').style.display = 'block';
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('registerUsername').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;

            try {
                const response = await fetch('/api/auth/register/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ username, email, password }),
                });

                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('authToken', data.access);
                    localStorage.setItem('refreshToken', data.refresh);
                    authToken = data.access;
                    refreshToken = data.refresh;
                    updateAuthUI(true);
                    showMainContent();
                    loadItems();
                } else {
                    document.getElementById('registerError').textContent = Object.values(data).join(', ');
                    document.getElementById('registerError').style.display = 'block';
                }
            } catch (error) {
                console.error('Registration error:', error);
                document.getElementById('registerError').textContent = 'An error occurred during registration';
                document.getElementById('registerError').style.display = 'block';
            }
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('refreshToken');
            authToken = null;
            refreshToken = null;
            updateAuthUI(false);
            showMainContent();
            loadItems();
        }

        function updateAuthUI(isLoggedIn) {
            document.getElementById('authButtons').classList.toggle('d-none', isLoggedIn);
            document.getElementById('userMenu').classList.toggle('d-none', !isLoggedIn);
        }

        // Get all items when page loads
        window.onload = function() {
            loadItems();
        };

        // Load items from the server
        async function loadItems() {
            showLoading();
            try {
                const response = await fetch('/api/items/');
                const data = await response.json();
                allItems = data.products;
                updateStoreFilter();
                showItems();
            } catch (error) {
                console.error('Error:', error);
                alert('Could not load items. Please try again.');
            }
            hideLoading();
        }

        // Show items on the page
        function showItems() {
            const itemsList = document.getElementById('itemsList');
            itemsList.innerHTML = '';

            let filteredItems = [...allItems];

            // Filter by store
            if (currentStore) {
                filteredItems = filteredItems.filter(item => 
                    item.store.toLowerCase() === currentStore.toLowerCase()
                );
            }

            // Sort items
            if (currentSort === 'low_to_high') {
                filteredItems.sort((a, b) => a.price - b.price);
            } else if (currentSort === 'high_to_low') {
                filteredItems.sort((a, b) => b.price - a.price);
            }

            // Show each item
            filteredItems.forEach(item => {
                const card = document.createElement('div');
                card.className = 'price-card';
                card.innerHTML = `
                    <h5>${item.name}</h5>
                    <p>Store: ${item.store}</p>
                    <p>Price: $${item.price.toFixed(2)}</p>
                    <p>Category: ${item.category}</p>
                `;
                itemsList.appendChild(card);
            });
        }

        // Update store filter options
        function updateStoreFilter() {
            const storeFilter = document.getElementById('storeFilter');
            const stores = [...new Set(allItems.map(item => item.store))];
            
            storeFilter.innerHTML = '<option value="">All Stores</option>';
            stores.forEach(store => {
                storeFilter.innerHTML += `<option value="${store}">${store}</option>`;
            });
        }

        // Apply filters
        function applyFilters() {
            currentStore = document.getElementById('storeFilter').value;
            currentSort = document.getElementById('sortOrder').value;
            showItems();
        }

        // Reset filters
        function resetFilters() {
            document.getElementById('storeFilter').value = '';
            document.getElementById('sortOrder').value = '';
            currentStore = '';
            currentSort = '';
            showItems();
        }

        // Show loading message
        function showLoading() {
            document.getElementById('loading').style.display = 'block';
        }

        // Hide loading message
        function hideLoading() {
            document.getElementById('loading').style.display = 'none';
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
